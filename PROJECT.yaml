# PROJECT.yaml — "Messer Swipe"
# The machine-readable facts. The audit cross-checks this file against the repo, the skill and
# ~/Server/services.yaml. A false manifest is worse than no manifest: keep it true.

schema: 1
standard: "1.3"
name: "messer-swipe"
display: "Messer Swipe"
family: "messer"
status: "active"
tier: "service"
kind: "repo"
skill: "swiparr"

stack:
  backend: "none"                # Next route handlers only; no separate server
  frontend: "next"
  router: "next-app"
  data: "sqlite"
  ui: "messer-ui"
  brand: "messer-swipe"
  port: 1

# A published manifest carries the facts a stranger can use. Where the estate instance runs, which
# stack it belongs to and which process manager starts it are host-local (STANDARD §11.1.1), so they
# live in the project skill, not here.
deploy:
  kind: "docker"
  image: "ghcr.io/jakobbjelver/messer-swipe"
  domain: "swipe.messer.wtf"      # the public demo; APP_PUBLIC_URL's default
  dev_domain: "dev-server.messer.wtf"

dev:
  command: "npm run dev"
  runner: "~/Scripts/run-messer-swipe-dev.sh"
  ports: [3000]
  pm2: "messer-swipe-dev"
  slot: "legacy-3000"

visibility: "public"
contributions: "closed"           # no pull requests
channels: "issues+discussions"    # bug reports and ideas are read; patches are not

health: "/api/health"

# Every exception is dated and has a reason. An expired exception is an error.
exceptions:
  - id: no-screenshot
    reason: The deck needs a seeded provider to render real cards — the hosted demo answers in TMDB mode with a skeleton deck, and a capture of a live install would show a real library. A seeded capture is the next documentation task.
    expires: 2027-02-28
  - id: nextjs
    reason: >-
      Next 16 App Router app with route handlers, iron-session auth and a Drizzle database. It is a
      legacy stack by STANDARD §4; a Go + Vite rewrite would be a product decision, not a cleanup.
    expires: "2027-06-30"
  - id: base-ui
    reason: >-
      The combobox atom uses Base UI while the rest of the UI is Radix. Both are vendored shadcn
      primitives; replacing the combobox is a separate change (canon has no combobox item yet).
    expires: "2027-06-30"
  - id: axios
    reason: >-
      Every provider client is axios with per-provider timeouts. Replacing it buys nothing while the
      provider layer stays; it is isolated behind src/lib/providers/*/api.ts.
    expires: "2027-06-30"
